    web_server:
      sorting_group_id: group_time_settings

  - platform: template
    id: straight_brew_run_time
    name: "Brew Time (straight)"
    unit_of_measurement: "s"
    min_value: 15
    max_value: 60
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 25.0
    web_server:
      sorting_group_id: group_time_settings

  - platform: template
    id: steam_timer_minutes
    name: "Steam Mode Sleep Timer"
    unit_of_measurement: "min"
    min_value: 1
    max_value: 30
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 10.0
    web_server:
      sorting_group_id: group_timer_settings

  - platform: template
    id: idle_timer_minutes
    name: "Idle Heater Sleep Timer"
    unit_of_measurement: "min"
    min_value: 5
    max_value: 120
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 60.0
    web_server:
      sorting_group_id: group_timer_settings

  - platform: template
    id: result_display_time
    name: "Result Display Time"
    unit_of_measurement: "s"
    min_value: 1
    max_value: 30
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 5.0
    web_server:
      sorting_group_id: group_timer_settings

  - platform: template
    id: backflush_fill_time
    name: "Backflush Fill Time"
    unit_of_measurement: "s"
    min_value: 3
    max_value: 10
