    optimistic: true
    restore_value: true
    initial_value: 5.0
    web_server:
      sorting_group_id: group_clean_settings

  - platform: template
    id: backflush_flush_time
    name: "Backflush Flush Time"
    unit_of_measurement: "s"
    min_value: 5
