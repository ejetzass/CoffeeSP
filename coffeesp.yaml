# ----
# CleverCoffee ESP32 PCB Rev 1.6 Pin Map
# ----
# HT_RL (Heater SSR)              -> GPIO2   (Slow PWM)
# PV_RL VALVE (3-way valve SSR)   -> GPIO17
# PV_RL PUMP  (Pump SSR)          -> GPIO27
# TSIC Temperature sensor         -> GPIO16
# Status LED                      -> GPIO26   (active-low: set inverted true if needed)
# I2C SDA/SCL (OLED, pressure)    -> GPIO21 / GPIO22
# Brew switch / optocoupler       -> GPIO34
# Steam switch                    -> GPIO35
# Hot water switch (straight brew)-> GPIO36
# Power switch                    -> GPIO39
# Water level sensor (optional)   -> GPIO23
# Scale interface DAT2/DAT/CLK    -> GPIO25 / GPIO32 / GPIO33 (currently unused)
# Reserved headers (future use)   -> GPIO1, GPIO3, GPIO4, GPIO5, GPIO18, GPIO19
# JTAG debugger pads              -> GPIO12 (TDI), GPIO13 (TCK), GPIO14 (TMS), GPIO15 (TDO)
# ----

substitutions:
  device_name: coffeesp
  friendly_name: CoffeeSP

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ESPHome PID controller with xs5871 TSIC integration, SH1106 128x64 display and relay control based on CleverCoffee PCB v1.6"
  project:
    name: coffeesp.espresso_controller
    version: "1.4.3"
  on_boot:
    priority: -10
    then:
      - switch.turn_on: heater_enable
      - climate.control:
          id: brew_pid
          mode: HEAT
          target_temperature: !lambda 'return id(brew_set_temp)->state;'
      - lambda: |-
          const uint32_t now = millis();
          id(current_phase) = id(steam_mode_active) ? 5 : 0;
          id(phase_start_ms) = now;
          id(phase_duration_ms) = 0;
          id(total_start_ms) = now;
          id(total_duration_ms) = 0;
          id(brew_finish_display_until) = 0;
      - text_sensor.template.publish:
          id: machine_status_text
          state: "Idle"

esp32:
  board: az-delivery-devkit-v4
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret esphomecoffee

ota:
  - platform: esphome
    password: !secret esphome_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback AP"
    password: "${device_name}"

time:
  - platform: homeassistant
    id: ha_time

external_components:
  - source: github://xs5871/esphome-tsic@main
    refresh: 1d

globals:
  - id: brewing_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: steam_mode_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: heater_allowed
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: current_phase
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: phase_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: phase_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: total_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: total_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: heater_output_level
    type: float
    restore_value: no
    initial_value: '0.0f'
  - id: idle_timer_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: idle_timer_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: idle_timer_expired
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: steam_timer_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: steam_timer_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: continuous_brew_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: continuous_brew_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: brew_finish_display_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: brew_cycle_success
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cleaning_mode
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: last_cleaning_mode
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_cycle_index
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_cycles_total
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_step_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_step_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_step_phase
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_complete_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pump_override_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: valve_override_state
    type: bool
    restore_value: no
    initial_value: 'false'

text_sensor:
  - platform: template
    id: machine_status_text
    name: "${friendly_name} Status"
    update_interval: never
    icon: mdi:coffee-maker

number:
  - platform: template
    id: brew_set_temp
    name: "Brew Target Temperature"
    unit_of_measurement: "°C"
    min_value: 80
    max_value: 110
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: 100.0
    on_value:
      - if:
          condition:
            lambda: 'return !id(steam_mode_active);'
          then:
            - climate.control:
                id: brew_pid
                target_temperature: !lambda 'return x;'

  - platform: template
    id: steam_set_temp
    name: "Steam Target Temperature"
    unit_of_measurement: "°C"
    min_value: 110
    max_value: 150
    step: 1.0
    optimistic: true
    restore_value: true
    initial_value: 125.0
    on_value:
      - if:
          condition:
            lambda: 'return id(steam_mode_active);'
          then:
            - climate.control:
                id: brew_pid
                target_temperature: !lambda 'return x;'

  - platform: template
    id: preinfuse_on_time
    name: "Pre-infusion Pump Time"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 15
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 5.0

  - platform: template
    id: preinfuse_pause_time
    name: "Pre-infusion Pause Time"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 15
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 5.0

  - platform: template
    id: brew_run_time
    name: "Brew Time (pre-infusion)"
    unit_of_measurement: "s"
    min_value: 5
    max_value: 60
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 25.0

  - platform: template
    id: straight_brew_run_time
    name: "Brew Time (straight)"
    unit_of_measurement: "s"
    min_value: 5
    max_value: 60
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 30.0

  - platform: template
    id: steam_timer_minutes
    name: "Steam Mode Sleep Timer"
    unit_of_measurement: "min"
    min_value: 1
    max_value: 30
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5.0

  - platform: template
    id: idle_timer_minutes
    name: "Idle Heater Sleep Timer"
    unit_of_measurement: "min"
    min_value: 5
    max_value: 120
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 60.0

  - platform: template
    id: backflush_step_time
    name: "Backflush Step Time"
    unit_of_measurement: "s"
    min_value: 1
    max_value: 30
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 5.0

  - platform: template
    id: purge_duration
    name: "Purge Duration"
    unit_of_measurement: "s"
    min_value: 1
    max_value: 60
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 3.0

output:
  - platform: slow_pwm
    id: heater_pwm_hw
    pin: GPIO2
    period: 1s
    min_power: 0.0
    max_power: 1.0

  - platform: template
    id: heater_pwm
    type: float
    write_action:
      lambda: |-
        float effective = state;
        if (!id(heater_allowed)) {
          effective = 0.0f;
        }
        if (effective < 0.0f) effective = 0.0f;
        if (effective > 1.0f) effective = 1.0f;
        id(heater_output_level) = effective;
        id(heater_pwm_hw).set_level(effective);

  - platform: gpio
    id: pump_output
    pin: GPIO27

  - platform: gpio
    id: valve_output
    pin: GPIO17

status_led:
  pin:
    number: GPIO26
    inverted: true

switch:
  - platform: template
    id: heater_enable
    name: "Heating Element"
    icon: mdi:radiator
    optimistic: false
    restore_mode: RESTORE_DEFAULT_ON
    lambda: 'return id(heater_allowed);'
    turn_on_action:
      - lambda: 'id(heater_allowed) = true;'
      - climate.control:
          id: brew_pid
          mode: HEAT
          target_temperature: !lambda |-
            return id(steam_mode_active)
                ? id(steam_set_temp)->state
                : id(brew_set_temp)->state;
      - script.execute: start_idle_timer
      - if:
          condition:
            lambda: 'return !id(steam_mode_active) && !id(brewing_active) && !id(continuous_brew_active);'
          then:
            - text_sensor.template.publish:
                id: machine_status_text
                state: "Idle"
    turn_off_action:
      - lambda: 'id(heater_allowed) = false;'
      - if:
          condition:
            lambda: 'return id(steam_mode_active);'
          then:
            - switch.turn_off: steam_mode_switch
      - climate.control:
          id: brew_pid
          mode: "OFF"
      - output.turn_off: heater_pwm
      - lambda: |-
          id(heater_pwm_hw).set_level(0.0f);
          id(heater_output_level) = 0.0f;
      - script.execute: cancel_idle_timer
      - text_sensor.template.publish:
          id: machine_status_text
          state: "Heater disabled"

  - platform: template
    id: steam_mode_switch
    name: "Steam Mode"
    icon: mdi:weather-windy
    optimistic: false
    lambda: 'return id(steam_mode_active);'
    turn_on_action:
      - if:
          condition:
            lambda: 'return !id(steam_mode_active) && !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - script.execute: enter_steam_mode
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(steam_mode_active);'
          then:
            - script.execute: exit_steam_mode

  - platform: template
    name: "Pump SSR Override"
    id: pump_override
    icon: mdi:pump
    optimistic: false
    lambda: 'return id(pump_override_state);'
    turn_on_action:
      - lambda: 'id(pump_override_state) = true;'
      - script.execute: pump_output_on
    turn_off_action:
      - lambda: 'id(pump_override_state) = false;'
      - script.execute: pump_output_off_guard

  - platform: template
    name: "3-Way Valve Override"
    id: valve_override
    icon: mdi:pipe-valve
    optimistic: false
    lambda: 'return id(valve_override_state);'
    turn_on_action:
      - lambda: 'id(valve_override_state) = true;'
      - script.execute: valve_output_on
    turn_off_action:
      - lambda: 'id(valve_override_state) = false;'
      - script.execute: valve_output_off_guard

button:
  - platform: template
    name: "Start Pre-infusion Brew"
    icon: mdi:coffee
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - script.execute: brew_preinfusion

  - platform: template
    name: "Start Straight Brew"
    icon: mdi:coffee-to-go
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - script.execute: brew_straight

  - platform: template
    name: "Start Continuous Brew"
    icon: mdi:coffee-maker
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - script.execute: brew_continuous

  - platform: template
    name: "Stop Brew / Process"
    icon: mdi:stop
    on_press:
      - script.execute: brew_abort

  - platform: template
    name: "Start Backflush"
    icon: mdi:water-sync
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - script.execute: clean_backflush

  - platform: template
    name: "Start Purge"
    icon: mdi:water-plus
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - script.execute: clean_purge

sensor:
  - platform: tsic
    id: brew_boiler_temp
    name: "Boiler Temperature"
    pin: GPIO16
    model: TSIC306
    update_interval: 0.5s

  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s

  - platform: uptime
    name: "Controller Uptime"
    update_interval: 60s

binary_sensor:
  - platform: gpio
    id: power_switch
    name: "Power Switch"
    pin:
      number: GPIO39
      inverted: true
      mode:
        input: true
    device_class: power
    filters:
      - delayed_on: 15ms
      - delayed_off: 15ms
    on_release:
      - script.execute: brew_abort
      - if:
          condition:
            switch.is_on: heater_enable
          then:
            - switch.turn_off: heater_enable
    on_press:
      - if:
          condition:
            switch.is_off: heater_enable
          then:
            - switch.turn_on: heater_enable

  - platform: gpio
    id: brew_switch
    name: "Pre-infusion Brew Switch"
    pin:
      number: GPIO34
      inverted: true
      mode:
        input: true
    filters:
      - delayed_on: 15ms
      - delayed_off: 15ms
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - script.execute: brew_preinfusion

  - platform: gpio
    id: straight_brew_switch
    name: "Straight Brew Switch"
    pin:
      number: GPIO36
      inverted: true
      mode:
        input: true
    filters:
      - delayed_on: 15ms
      - delayed_off: 15ms
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - script.execute: brew_straight

  - platform: gpio
    id: steam_switch
    name: "Steam Switch"
    pin:
      number: GPIO35
      inverted: true
      mode:
        input: true
    filters:
      - delayed_on: 15ms
      - delayed_off: 15ms
    on_press:
      - switch.turn_on: steam_mode_switch
    on_release:
      - switch.turn_off: steam_mode_switch

climate:
  - platform: pid
    id: brew_pid
    name: "Boiler PID"
    sensor: brew_boiler_temp
    default_target_temperature: 100 °C
    heat_output: heater_pwm
    visual:
      min_temperature: 60 °C
      max_temperature: 150 °C
      temperature_step: 0.1 °C
    control_parameters:
      kp: 25.0
      ki: 0.15
      kd: 120.0
    on_state:
      - if:
          condition:
            lambda: 'return !id(heater_allowed);'
          then:
            - output.turn_off: heater_pwm

interval:
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();

          if (id(idle_timer_active)) {
            const uint32_t duration_ms = static_cast<uint32_t>(id(idle_timer_minutes)->state * 60000.0f);
            if (duration_ms > 0 && now - id(idle_timer_start_ms) >= duration_ms) {
              id(idle_timer_active) = false;
              id(idle_timer_expired) = true;
              id(machine_status_text).publish_state("Idle timeout");
              if (id(heater_enable).state) {
                id(heater_enable).turn_off();
              }
            }
          }

          if (id(steam_timer_active) && id(steam_mode_active)) {
            const uint32_t duration_ms = static_cast<uint32_t>(id(steam_timer_minutes)->state * 60000.0f);
            if (duration_ms > 0 && now - id(steam_timer_start_ms) >= duration_ms) {
              id(steam_timer_active) = false;
              id(machine_status_text).publish_state("Steam timer");
              id(steam_mode_switch).turn_off();
            }
          }

          if (!id(brewing_active) && !id(continuous_brew_active) &&
              id(brew_finish_display_until) > 0 && now >= id(brew_finish_display_until)) {
            id(brew_finish_display_until) = 0;
            if (!id(steam_mode_active) && id(heater_allowed) && !id(idle_timer_expired)) {
              id(machine_status_text).publish_state("Idle");
            }
          }

          if (id(cleaning_complete_until) > 0 && now >= id(cleaning_complete_until)) {
            id(cleaning_complete_until) = 0;
            if (!id(steam_mode_active) && !id(brewing_active) &&
                !id(continuous_brew_active) && id(cleaning_mode) == 0) {
              id(machine_status_text).publish_state(id(heater_allowed) ? "Idle" : "Heater disabled");
            }
          }

script:
  - id: pump_output_on
    mode: restart
    then:
      - output.turn_on: pump_output

  - id: pump_output_off_guard
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(pump_override_state);'
          then:
            - output.turn_off: pump_output

  - id: valve_output_on
    mode: restart
    then:
      - output.turn_on: valve_output

  - id: valve_output_off_guard
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(valve_override_state);'
          then:
            - output.turn_off: valve_output

  - id: start_idle_timer
    mode: restart
    then:
      - lambda: |-
          id(idle_timer_active) = true;
          id(idle_timer_expired) = false;
          id(idle_timer_start_ms) = millis();

  - id: cancel_idle_timer
    mode: restart
    then:
      - lambda: 'id(idle_timer_active) = false;'

  - id: start_steam_timer
    mode: restart
    then:
      - lambda: |-
          id(steam_timer_active) = true;
          id(steam_timer_start_ms) = millis();

  - id: cancel_steam_timer
    mode: restart
    then:
      - lambda: 'id(steam_timer_active) = false;'

  - id: pump_and_valve_off_guard
    mode: restart
    then:
      - script.execute: pump_output_off_guard
      - script.execute: valve_output_off_guard

  - id: brew_finish
    mode: restart
    then:
      - script.execute: pump_and_valve_off_guard
      - lambda: |-
          id(brewing_active) = false;
          id(continuous_brew_active) = false;
          const uint32_t now = millis();
          id(total_duration_ms) = 0;
          id(total_start_ms) = now;
          id(phase_duration_ms) = 0;
          id(phase_start_ms) = now;
          id(current_phase) = id(steam_mode_active) ? 5 : 0;
          if (id(brew_cycle_success)) {
            id(brew_finish_display_until) = now + 15000UL;
            id(machine_status_text).publish_state("Brew finished");
          } else if (!id(steam_mode_active)) {
            id(machine_status_text).publish_state("Idle");
          }
      - if:
          condition:
            lambda: 'return id(steam_mode_active);'
          then:
            - text_sensor.template.publish:
                id: machine_status_text
                state: "Steam"

  - id: brew_abort
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(cleaning_mode) != 0;'
          then:
            - script.execute: cleaning_cancel
      - if:
          condition:
            lambda: 'return id(continuous_brew_active);'
          then:
            - script.execute: pump_and_valve_off_guard
            - lambda: |-
                const uint32_t now = millis();
                id(continuous_brew_active) = false;
                id(brewing_active) = false;
                id(current_phase) = id(steam_mode_active) ? 5 : 0;
                id(total_duration_ms) = 0;
                id(total_start_ms) = now;
                id(phase_duration_ms) = 0;
                id(phase_start_ms) = now;
                id(machine_status_text).publish_state("Continuous stop");
            - delay: 500ms
            - if:
                condition:
                  lambda: 'return !id(steam_mode_active) && id(heater_allowed) && !id(idle_timer_expired) && id(cleaning_mode) == 0;'
                then:
                  - text_sensor.template.publish:
                      id: machine_status_text
                      state: "Idle"
      - if:
          condition:
            lambda: 'return !id(heater_allowed);'
          then:
            - text_sensor.template.publish:
                id: machine_status_text
                state: "Heater disabled"
      - if:
          condition:
            lambda: 'return id(brewing_active);'
          then:
            - lambda: |-
                id(brew_cycle_success) = false;
                id(brew_finish_display_until) = 0;
            - text_sensor.template.publish:
                id: machine_status_text
                state: "Brew stop"
            - script.execute: pump_output_off_guard
            - delay: 1s
            - script.execute: brew_finish

  - id: brew_preinfusion
    mode: restart
    then:
      - lambda: |-
          id(brewing_active) = true;
          id(continuous_brew_active) = false;
          id(steam_mode_active) = false;
          id(brew_cycle_success) = true;
          id(brew_finish_display_until) = 0;
          const uint32_t now = millis();
          const uint32_t pre_ms = static_cast<uint32_t>(id(preinfuse_on_time)->state * 1000.0f);
          const uint32_t pause_ms = static_cast<uint32_t>(id(preinfuse_pause_time)->state * 1000.0f);
          const uint32_t brew_ms = static_cast<uint32_t>(id(brew_run_time)->state * 1000.0f);
          id(total_start_ms) = now;
          id(total_duration_ms) = pre_ms + pause_ms + brew_ms;
          id(phase_start_ms) = now;
          if (pre_ms > 0) {
            id(current_phase) = 1;
            id(phase_duration_ms) = pre_ms;
          } else if (pause_ms > 0) {
            id(current_phase) = 2;
            id(phase_duration_ms) = pause_ms;
          } else {
            id(current_phase) = 3;
            id(phase_duration_ms) = brew_ms;
          }
      - switch.template.publish:
          id: steam_mode_switch
          state: false
      - climate.control:
          id: brew_pid
          mode: HEAT
          target_temperature: !lambda 'return id(brew_set_temp)->state;'
      - text_sensor.template.publish:
          id: machine_status_text
          state: "Preinfuse"
      - script.execute: valve_output_on
      - if:
          condition:
            lambda: 'return id(preinfuse_on_time)->state > 0.0f;'
          then:
            - script.execute: pump_output_on
            - delay: !lambda 'return static_cast<uint32_t>(id(preinfuse_on_time)->state * 1000.0f);'
            - script.execute: pump_output_off_guard
      - if:
          condition:
            lambda: 'return id(preinfuse_pause_time)->state > 0.0f;'
          then:
            - lambda: |-
                id(current_phase) = 2;
                id(phase_start_ms) = millis();
                id(phase_duration_ms) = static_cast<uint32_t>(id(preinfuse_pause_time)->state * 1000.0f);
            - text_sensor.template.publish:
                id: machine_status_text
                state: "Bloom"
            - delay: !lambda 'return static_cast<uint32_t>(id(preinfuse_pause_time)->state * 1000.0f);'
      - text_sensor.template.publish:
          id: machine_status_text
          state: "Brew"
      - lambda: |-
          id(current_phase) = 3;
          id(phase_start_ms) = millis();
          id(phase_duration_ms) = static_cast<uint32_t>(id(brew_run_time)->state * 1000.0f);
      - script.execute: pump_output_on
      - delay: !lambda 'return static_cast<uint32_t>(id(brew_run_time)->state * 1000.0f);'
      - text_sensor.template.publish:
          id: machine_status_text
          state: "Finish"
      - script.execute: brew_finish

  - id: brew_straight
    mode: restart
    then:
      - lambda: |-
          id(brewing_active) = true;
          id(continuous_brew_active) = false;
          id(steam_mode_active) = false;
          id(brew_cycle_success) = true;
          id(brew_finish_display_until) = 0;
          const uint32_t now = millis();
          const uint32_t brew_ms = static_cast<uint32_t>(id(straight_brew_run_time)->state * 1000.0f);
          id(total_start_ms) = now;
          id(total_duration_ms) = brew_ms;
          id(current_phase) = 3;
          id(phase_start_ms) = now;
          id(phase_duration_ms) = brew_ms;
      - switch.template.publish:
          id: steam_mode_switch
          state: false
      - climate.control:
          id: brew_pid
          mode: HEAT
          target_temperature: !lambda 'return id(brew_set_temp)->state;'
      - script.execute: valve_output_on
      - text_sensor.template.publish:
          id: machine_status_text
          state: "Straight"
      - script.execute: pump_output_on
      - delay: !lambda 'return static_cast<uint32_t>(id(straight_brew_run_time)->state * 1000.0f);'
      - text_sensor.template.publish:
          id: machine_status_text
          state: "Finish"
      - script.execute: brew_finish

  - id: brew_continuous
    mode: restart
    then:
      - lambda: |-
          id(brewing_active) = true;
          id(continuous_brew_active) = true;
          id(steam_mode_active) = false;
          id(brew_cycle_success) = false;
          id(brew_finish_display_until) = 0;
          id(current_phase) = 9;
          const uint32_t now = millis();
          id(total_start_ms) = now;
          id(total_duration_ms) = 0;
          id(continuous_brew_start_ms) = now;
          id(machine_status_text).publish_state("Continuous");
      - switch.template.publish:
          id: steam_mode_switch
          state: false
      - script.execute: valve_output_on
      - script.execute: pump_output_on

  - id: enter_steam_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(heater_allowed);'
          then:
            - switch.turn_on: heater_enable
            - delay: 200ms
      - if:
          condition:
            lambda: 'return id(brewing_active) || id(continuous_brew_active);'
          then:
            - script.execute: brew_abort
            - delay: 1s
      - if:
          condition:
            lambda: 'return id(cleaning_mode) != 0;'
          then:
            - script.execute: cleaning_cancel
      - lambda: |-
          id(steam_mode_active) = true;
          id(brewing_active) = false;
          id(continuous_brew_active) = false;
          id(current_phase) = 5;
          const uint32_t now = millis();
          id(phase_start_ms) = now;
          id(phase_duration_ms) = 0;
          id(total_start_ms) = now;
          id(total_duration_ms) = 0;
      - switch.template.publish:
          id: steam_mode_switch
          state: true
      - script.execute: pump_output_off_guard
      - script.execute: valve_output_off_guard
      - text_sensor.template.publish:
          id: machine_status_text
          state: "Steam"
      - climate.control:
          id: brew_pid
          mode: HEAT
          target_temperature: !lambda 'return id(steam_set_temp)->state;'
      - script.execute: start_steam_timer

  - id: exit_steam_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(steam_mode_active);'
          then:
            - lambda: |-
                id(steam_mode_active) = false;
                const uint32_t now = millis();
                id(current_phase) = 0;
                id(phase_start_ms) = now;
                id(phase_duration_ms) = 0;
                id(total_start_ms) = now;
                id(total_duration_ms) = 0;
            - text_sensor.template.publish:
                id: machine_status_text
                state: "Cooling"
            - climate.control:
                id: brew_pid
                mode: HEAT
                target_temperature: !lambda 'return id(brew_set_temp)->state;'
            - script.execute: cancel_steam_timer
            - delay: 2s
            - if:
                condition:
                  lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
                then:
                  - text_sensor.template.publish:
                      id: machine_status_text
                      state: "Idle"

  - id: clean_backflush
    mode: restart
    then:
      - switch.turn_off: pump_override
      - switch.turn_off: valve_override
      - lambda: |-
          id(cleaning_mode) = 1;
          id(last_cleaning_mode) = 1;
          id(cleaning_complete_until) = 0;
          id(cleaning_cycle_index) = 0;
          id(cleaning_cycles_total) = 5;
          id(cleaning_step_phase) = 0;
          id(machine_status_text).publish_state("Backflush");
      - script.execute: clean_backflush_cycle

  - id: clean_backflush_cycle
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(cleaning_mode) == 1 && id(cleaning_cycle_index) >= id(cleaning_cycles_total);'
          then:
            - script.execute: cleaning_finish
      - if:
          condition:
            lambda: 'return id(cleaning_mode) == 1 && id(cleaning_cycle_index) < id(cleaning_cycles_total);'
          then:
            - lambda: |-
                id(cleaning_cycle_index) += 1;
                const uint32_t step_ms = static_cast<uint32_t>(id(backflush_step_time)->state * 1000.0f);
                id(cleaning_step_phase) = 1;
                id(cleaning_step_start_ms) = millis();
                id(cleaning_step_duration_ms) = step_ms;
                char buf[24];
                snprintf(buf, sizeof(buf), "Backflush %u/5",
                         static_cast<unsigned>(id(cleaning_cycle_index)));
                id(machine_status_text).publish_state(buf);
            - script.execute: pump_output_on
            - script.execute: valve_output_on
            - delay: !lambda 'return static_cast<uint32_t>(id(backflush_step_time)->state * 1000.0f);'
            - if:
                condition:
                  lambda: 'return id(cleaning_mode) == 1;'
                then:
                  - lambda: |-
                      const uint32_t step_ms = static_cast<uint32_t>(id(backflush_step_time)->state * 1000.0f);
                      id(cleaning_step_phase) = 2;
                      id(cleaning_step_start_ms) = millis();
                      id(cleaning_step_duration_ms) = step_ms;
                      char buf[24];
                      snprintf(buf, sizeof(buf), "Backflush rest %u",
                               static_cast<unsigned>(id(cleaning_cycle_index)));
                      id(machine_status_text).publish_state(buf);
                  - script.execute: pump_output_off_guard
                  - script.execute: valve_output_off_guard
                  - delay: !lambda 'return static_cast<uint32_t>(id(backflush_step_time)->state * 1000.0f);'
                  - script.execute: clean_backflush_cycle

  - id: clean_purge
    mode: restart
    then:
      - switch.turn_off: pump_override
      - switch.turn_off: valve_override
      - lambda: |-
          id(cleaning_mode) = 2;
          id(last_cleaning_mode) = 2;
          id(cleaning_complete_until) = 0;
          id(cleaning_cycle_index) = 1;
          id(cleaning_cycles_total) = 1;
          const uint32_t step_ms = static_cast<uint32_t>(id(purge_duration)->state * 1000.0f);
          id(cleaning_step_phase) = 1;
          id(cleaning_step_start_ms) = millis();
          id(cleaning_step_duration_ms) = step_ms;
          id(machine_status_text).publish_state("Purge");
      - script.execute: pump_output_on
      - script.execute: valve_output_on
      - delay: !lambda 'return static_cast<uint32_t>(id(purge_duration)->state * 1000.0f);'
      - script.execute: cleaning_finish

  - id: cleaning_finish
    mode: restart
    then:
      - script.execute: pump_and_valve_off_guard
      - lambda: |-
          const uint32_t now = millis();
          id(cleaning_step_phase) = 0;
          id(cleaning_step_duration_ms) = 0;
          id(cleaning_cycle_index) = 0;
          id(cleaning_mode) = 0;
          id(cleaning_complete_until) = now + 5000UL;
          if (id(last_cleaning_mode) == 1) {
            id(machine_status_text).publish_state("Backflush done");
          } else if (id(last_cleaning_mode) == 2) {
            id(machine_status_text).publish_state("Purge done");
          } else {
            id(machine_status_text).publish_state("Cleaning done");
          }

  - id: cleaning_cancel
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(cleaning_mode) != 0;'
          then:
            - script.execute: pump_and_valve_off_guard
            - lambda: |-
                const uint32_t now = millis();
                id(last_cleaning_mode) = id(cleaning_mode);
                id(cleaning_mode) = 0;
                id(cleaning_step_phase) = 0;
                id(cleaning_step_duration_ms) = 0;
                id(cleaning_cycle_index) = 0;
                id(cleaning_complete_until) = now + 5000UL;
                id(machine_status_text).publish_state("Cleaning cancel");

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

font:
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 12
  - file: "gfonts://Roboto Mono"
    id: font_tiny
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    id: front_oled
    address: 0x3C
    offset_x: 2
    offset_y: 0
    update_interval: 0.25s
    flip_x: false
    flip_y: false
    lambda: |-
      it.fill(Color::BLACK);

      const uint32_t now = millis();
      const int line_step = 12;
      const int y_temp = 0;
      const int y_set = 12;
      const int y_base_with_set = 24;
      const int y_base_without_set = 12;
      const int bar_y = 56;

      auto fmt_time = [](uint32_t ms, char *out, size_t len) {
        const uint32_t total_seconds = (ms + 500) / 1000;
        const uint32_t minutes = total_seconds / 60;
        const uint32_t seconds = total_seconds % 60;
        snprintf(out, len, "%02u:%02u",
                 static_cast<unsigned>(minutes),
                 static_cast<unsigned>(seconds));
      };

      auto draw_progress = [&](float prog) {
        if (prog < 0.0f) prog = 0.0f;
        if (prog > 1.0f) prog = 1.0f;
        const int bar_h = 6;
        const int bar_w = 128;
        it.rectangle(0, bar_y, bar_w, bar_h);
        const int fill = static_cast<int>((bar_w - 2) * prog);
        if (fill > 0) {
          it.filled_rectangle(1, bar_y + 1, fill, bar_h - 2);
        }
      };

      float temp = id(brew_boiler_temp).state;
      float target = id(steam_mode_active)
                       ? id(steam_set_temp)->state
                       : id(brew_set_temp)->state;
      float pid_pct = id(heater_allowed) ? (id(heater_output_level) * 100.0f) : 0.0f;
      pid_pct = std::max(0.0f, std::min(100.0f, pid_pct));

      if (isnan(temp)) {
        it.printf(0, y_temp, id(font_small), "T: --.-°C");
      } else {
        it.printf(0, y_temp, id(font_small), "T: %.1f°C", temp);
      }

      bool cleaning_active = (id(cleaning_mode) != 0);
      bool cleaning_message = (!cleaning_active && id(cleaning_complete_until) > now);
      bool show_setpoint_line = !(cleaning_active || cleaning_message);

      if (show_setpoint_line) {
        if (isnan(target)) {
          it.printf(0, y_set, id(font_small), "S: --.-°C  P:%3.0f%%", pid_pct);
        } else {
          it.printf(0, y_set, id(font_small), "S: %.1f°C  P:%3.0f%%", target, pid_pct);
        }
      }

      const uint32_t idle_duration_ms =
          static_cast<uint32_t>(id(idle_timer_minutes)->state * 60000.0f);
      uint32_t idle_remaining_ms = 0;
      if (id(idle_timer_active) && idle_duration_ms > 0) {
        const uint32_t elapsed = now - id(idle_timer_start_ms);
        if (elapsed < idle_duration_ms) {
          idle_remaining_ms = idle_duration_ms - elapsed;
        }
      }

      const uint32_t steam_duration_ms =
          static_cast<uint32_t>(id(steam_timer_minutes)->state * 60000.0f);
      uint32_t steam_remaining_ms = 0;
      if (id(steam_mode_active) && id(steam_timer_active) && steam_duration_ms > 0) {
        const uint32_t elapsed = now - id(steam_timer_start_ms);
        if (elapsed < steam_duration_ms) {
          steam_remaining_ms = steam_duration_ms - elapsed;
        }
      }

      bool continuous = id(continuous_brew_active);
      bool brew_finished_screen = (id(brew_finish_display_until) > now);
      bool brew_active = id(brewing_active) || brew_finished_screen || continuous;

      bool override_mode =
          (!id(heater_allowed) || id(pump_override_state) ||
           id(valve_override_state) || id(idle_timer_expired));
      bool show_override_screen =
          override_mode && !cleaning_active && !cleaning_message &&
          !brew_active && !id(steam_mode_active);

      uint32_t total_duration = id(total_duration_ms);
      uint32_t total_elapsed =
          (now >= id(total_start_ms)) ? (now - id(total_start_ms)) : 0;
      if (total_duration > 0 && total_elapsed > total_duration) {
        total_elapsed = total_duration;
      }

      bool idle_screen =
          (!brew_active && !cleaning_active && !cleaning_message &&
           !id(steam_mode_active) && !show_override_screen);

      auto build_override_list = [&]() {
        char overrides[24];
        overrides[0] = '\0';
        auto append = [&](const char *word) {
          if (word == nullptr || word[0] == '\0') return;
          if (strlen(overrides) > 0) strlcat(overrides, " ", sizeof(overrides));
          strlcat(overrides, word, sizeof(overrides));
        };
        if (!id(heater_allowed)) append("Boil");
        if (id(idle_timer_expired)) append("Idle");
        if (id(pump_override_state)) append("Pump");
        if (id(valve_override_state)) append("Valve");
        if (overrides[0] == '\0') append("--");
        return std::string(overrides);
      };

      float progress_value = 0.0f;
      bool show_progress = false;

      const int content_y1 = show_setpoint_line ? y_base_with_set : y_base_without_set;
      const int content_y2 = content_y1 + line_step;
      const int content_y3 = content_y2 + line_step;

      if (cleaning_active || cleaning_message) {
        if (cleaning_active) {
          const char *mode_str =
              (id(cleaning_mode) == 1) ? "Backfl" :
              (id(cleaning_mode) == 2 ? "Purge" : "Clean");
          uint8_t total_cycles = id(cleaning_cycles_total);
          uint8_t current_cycle = id(cleaning_cycle_index);
          const char *phase_str =
              (id(cleaning_step_phase) == 1) ? "On" :
              (id(cleaning_step_phase) == 2 ? "Off" : "--");

          if (total_cycles == 0) total_cycles = 1;
          it.printf(0, content_y1, id(font_small), "%s %u/%u %s",
                    mode_str,
                    static_cast<unsigned>(current_cycle),
                    static_cast<unsigned>(total_cycles),
                    phase_str);

          if (id(cleaning_step_duration_ms) > 0) {
            uint32_t step_elapsed =
                (now >= id(cleaning_step_start_ms))
                    ? (now - id(cleaning_step_start_ms))
                    : 0;
            if (step_elapsed > id(cleaning_step_duration_ms)) {
              step_elapsed = id(cleaning_step_duration_ms);
            }
            const uint32_t step_remaining =
                (id(cleaning_step_duration_ms) > step_elapsed)
                    ? (id(cleaning_step_duration_ms) - step_elapsed)
                    : 0;

            char step_remain[8];
            char step_total[8];
            fmt_time(step_remaining, step_remain, sizeof(step_remain));
            fmt_time(id(cleaning_step_duration_ms), step_total, sizeof(step_total));
            it.printf(0, content_y2, id(font_small), "Time %s/%s",
                      step_remain, step_total);

            if (id(cleaning_mode) == 1 && total_cycles > 0) {
              float base = (current_cycle > 0)
                             ? static_cast<float>(current_cycle - 1) * 2.0f
                             : 0.0f;
              float phase_fraction =
                  (id(cleaning_step_duration_ms) > 0)
                      ? (static_cast<float>(step_elapsed) /
                         static_cast<float>(id(cleaning_step_duration_ms)))
                      : 0.0f;
              if (id(cleaning_step_phase) == 1) {
                progress_value =
                    (base + phase_fraction) / (total_cycles * 2.0f);
              } else if (id(cleaning_step_phase) == 2) {
                progress_value =
                    (base + 1.0f + phase_fraction) / (total_cycles * 2.0f);
              } else {
                progress_value =
                    static_cast<float>(current_cycle) /
                    static_cast<float>(total_cycles);
              }
            } else if (id(cleaning_mode) == 2 &&
                       id(cleaning_step_duration_ms) > 0) {
              progress_value =
                  static_cast<float>(step_elapsed) /
                  static_cast<float>(id(cleaning_step_duration_ms));
            }
            show_progress = true;
          } else {
            it.printf(0, content_y2, id(font_small), "Time --:--/--:--");
          }

          if (!id(heater_allowed)) {
            it.printf(0, content_y3, id(font_small), "Heater OFF");
          } else {
            it.printf(0, content_y3, id(font_small), "Cleaning...");
          }
        } else {
          const char *mode_str =
              (id(last_cleaning_mode) == 1) ? "Backfl" :
              (id(last_cleaning_mode) == 2 ? "Purge" : "Clean");
          it.printf(0, content_y1, id(font_small), "%s done", mode_str);
          it.printf(0, content_y2, id(font_small), "Ready");
        }
      } else if (brew_active) {
        if (continuous) {
          it.printf(0, content_y1, id(font_small), "Continuous");
          char run_buf[8];
          fmt_time(now - id(continuous_brew_start_ms), run_buf, sizeof(run_buf));
          it.printf(0, content_y2, id(font_small), "Run %s", run_buf);
          it.printf(0, content_y3, id(font_small), "Stop to end");
        } else if (brew_finished_screen) {
          const bool success = id(brew_cycle_success);
          it.printf(0, content_y1, id(font_small),
                    success ? "Brew done" : "Brew stop");
          show_progress = true;
          progress_value = 1.0f;
        } else {
          const char *phase_name = "Ready";
          switch (id(current_phase)) {
            case 1: phase_name = "Preinfuse"; break;
            case 2: phase_name = "Bloom";     break;
            case 3: phase_name = "Brew";      break;
            case 4: phase_name = "Vent";      break;
          }
          it.printf(0, content_y1, id(font_small), "%s", phase_name);

          char elapsed_buf[8];
          fmt_time(total_elapsed, elapsed_buf, sizeof(elapsed_buf));
          it.printf(0, content_y2, id(font_small), "Elapsed %s", elapsed_buf);

          show_progress = (total_duration > 0);
          progress_value =
              (total_duration > 0)
                  ? static_cast<float>(total_elapsed) /
                    static_cast<float>(total_duration)
                  : 0.0f;
        }
      } else if (id(steam_mode_active)) {
        if (id(steam_timer_active) && steam_remaining_ms > 0) {
          char steam_buf[8];
          fmt_time(steam_remaining_ms, steam_buf, sizeof(steam_buf));
          it.printf(0, content_y1, id(font_small), "Steam timer %s", steam_buf);
        } else if (id(steam_timer_active)) {
          it.printf(0, content_y1, id(font_small), "Steam timer --:--");
        } else {
          it.printf(0, content_y1, id(font_small), "Steam ready");
        }
        if (!id(heater_allowed)) {
          it.printf(0, content_y2, id(font_small), "Heater OFF");
        }
      } else if (show_override_screen) {
        const std::string overrides = build_override_list();
        it.printf(0, content_y1, id(font_small), "Overrides");
        it.printf(0, content_y2, id(font_small), "%s", overrides.c_str());
        if (!id(heater_allowed)) {
          it.printf(0, content_y3, id(font_small), "Heater OFF");
        } else if (id(idle_timer_expired)) {
          it.printf(0, content_y3, id(font_small), "Idle expired");
        }
      } else if (idle_screen) {
          it.printf(0, content_y1, id(font_small), "%.1f/%.1f/%.1fs", id(preinfuse_on_time)->state, id(preinfuse_pause_time)->state, id(brew_run_time)->state);
        if (!id(heater_allowed)) {
          it.printf(0, content_y2, id(font_small), "Heater OFF");
        } else if (id(idle_timer_expired)) {
          it.printf(0, content_y2, id(font_small), "Idle expired");
        } else {
          it.printf(0, content_y2, id(font_small), "Ready");
        }

        if (id(idle_timer_active)) {
          char idle_buf[8];
          fmt_time(idle_remaining_ms, idle_buf, sizeof(idle_buf));
          it.printf(0, content_y3, id(font_small), "Idle %s", idle_buf);
        } else if (id(idle_timer_expired)) {
          it.printf(0, content_y3, id(font_small), "Idle 00:00");
        }
      }

      if (show_progress) {
        draw_progress(progress_value);
      }
