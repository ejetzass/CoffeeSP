    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 10.0
    web_server:
      sorting_group_id: group_clean_settings

  - platform: template
    id: backflush_cycles
    name: "Backflush Cycles"
    unit_of_measurement: "cycles"
    min_value: 1
    max_value: 20
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5
    web_server:
      sorting_group_id: group_clean_settings

  - platform: template
    id: purge_duration
    name: "Purge Duration"
    unit_of_measurement: "s"
    min_value: 1
    max_value: 60
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 3.0
    web_server:
      sorting_group_id: group_clean_settings

output:
  - platform: gpio
    id: pump_output
    pin: GPIO27

  - platform: gpio
    id: valve_output
    pin: GPIO17

status_led:
  pin:
    number: GPIO26
    inverted: true

switch:
  - platform: gpio
    id: heater_ssr
    pin: GPIO2
    restore_mode: ALWAYS_OFF

  - platform: template
    id: heater_enable
    name: "Heating Element"
    icon: mdi:radiator
    optimistic: false
    web_server:
      sorting_group_id: group_switch
    restore_mode: RESTORE_DEFAULT_ON
    lambda: 'return id(heater_allowed);'
    turn_on_action:
      - if:
          condition:
            lambda: |-
              if (isnan(id(brew_boiler_temp).state) || !id(brew_boiler_temp).has_state()) {
                return false;
              }
              return true;
          then:
            - lambda: 'id(heater_allowed) = true;'
            - script.execute: start_idle_timer
            - if:
                condition:
                  lambda: 'return !id(steam_mode_active) && !id(brewing_active) && !id(continuous_brew_active);'
                then:
                  - lambda: |-
                      bool pid_only = (!id(pump_relay_enable)->state && !id(valve_relay_enable)->state);
                      id(publish_status)->execute("I0", pid_only ? "PID only" : "Idle");
          else:
            - script.execute:
                id: publish_status
                code: "XE"
                text: "Temp invalid"
    turn_off_action:
      - lambda: 'id(heater_allowed) = false;'
      - if:
          condition:
            lambda: 'return id(steam_mode_active);'
          then:
            - script.execute: exit_steam_mode
      - switch.turn_off: heater_ssr
      - lambda: |-
          id(heater_output_level) = 0.0f;
      - script.execute: cancel_idle_timer
      - script.execute:
          id: publish_status
          code: "IH"
          text: "Heater disabled"

  - platform: template
    name: "Pump SSR Override"
    id: pump_override
    icon: mdi:pump
    optimistic: false
    web_server:
      sorting_group_id: group_switch
    lambda: 'return id(pump_override_state);'
    turn_on_action:
      - if:
          condition:
            lambda: 'return id(pump_relay_enable)->state;'
          then:
            - lambda: 'id(pump_override_state) = true;'
            - script.execute: pump_output_on
    turn_off_action:
      - lambda: 'id(pump_override_state) = false;'
      - script.execute: pump_output_off_guard

  - platform: template
    name: "3-Way Valve Override"
    id: valve_override
    icon: mdi:pipe-valve
    optimistic: false
    web_server:
      sorting_group_id: group_switch
    lambda: 'return id(valve_override_state);'
    turn_on_action:
      - if:
          condition:
            lambda: 'return id(valve_relay_enable)->state;'
          then:
            - lambda: 'id(valve_override_state) = true;'
            - script.execute: valve_output_on
    turn_off_action:
      - lambda: 'id(valve_override_state) = false;'
      - script.execute: valve_output_off_guard

  - platform: template
    id: idle_timer_enable
    name: "Idle Timer Enable"
    icon: mdi:timer-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: group_timer_settings

  - platform: template
    id: steam_timer_enable
    name: "Steam Timer Enable"
    icon: mdi:timer-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: group_timer_settings

  - platform: template
    id: pid_debug_enable
    name: "PID Debug Logging"
    icon: mdi:bug
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: group_server

  - platform: template
    id: sensor_logging_enable
    name: "Sensor Logging"
    icon: mdi:gauge
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: group_server

  - platform: template
    id: pump_relay_enable
    name: "Pump Relay Enable"
    icon: mdi:pump
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: group_hardware
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(pump_override_state);'
          then:
            - switch.turn_off: pump_override

  - platform: template
    id: valve_relay_enable
    name: "3-Way Valve Relay Enable"
    icon: mdi:pipe-valve
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: group_hardware
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(valve_override_state);'
          then:
            - switch.turn_off: valve_override

button:
  - platform: template
    id: steam_mode_toggle
    name: "Steam Mode"
    icon: mdi:weather-windy
    web_server:
      sorting_group_id: group_brew
    on_press:
      - if:
          condition:
            lambda: 'return id(steam_mode_active);'
          then:
            - script.execute: exit_steam_mode
          else:
            - if:
                condition:
                  lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
                then:
                  - script.execute: enter_steam_mode

  - platform: template
    name: "Start Pressurized Pre-infusion Brew"
    icon: mdi:coffee
    web_server:
      sorting_group_id: group_brew
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - lambda: 'id(active_brew_mode) = 1;'
            - script.execute: brew_preinfusion

  - platform: template
    name: "Start Soft Pre-infusion Brew"
    icon: mdi:coffee-outline
    web_server:
      sorting_group_id: group_brew
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - lambda: 'id(active_brew_mode) = 2;'
            - script.execute: brew_soft_preinfusion

  - platform: template
    name: "Start Straight Brew"
    icon: mdi:coffee-to-go
    web_server:
      sorting_group_id: group_brew
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - lambda: 'id(active_brew_mode) = 3;'
            - script.execute: brew_straight

  - platform: template
    name: "Start Continuous Brew"
    icon: mdi:coffee-maker
    web_server:
      sorting_group_id: group_brew
    on_press:
      - if:
          condition:
            lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
          then:
            - lambda: 'id(active_brew_mode) = 4;'
            - script.execute: brew_continuous

  - platform: template
    name: "Stop Brew / Process"
    icon: mdi:stop
    web_server:
