# CleverCoffee-style PID with Burst-fired SSR Control
interval:
  - interval: 0.1s
    then:
      - lambda: |-
          // CleverCoffee-style PID + burst-fired SSR output

          // Persistent state
          static uint32_t last_ms = millis();
          static float last_temp = NAN;
          static float d_filt = 0.0f;        // filtered D term
          static float Iacc = 0.0f;          // raw integral accumulator (pre-Ki)
          static uint32_t window_start_ms = millis();

          auto clamp01 = [](float x) { return x < 0.0f ? 0.0f : (x > 1.0f ? 1.0f : x); };
          auto clampPct = [](float x) { return x < 0.0f ? 0.0f : (x > 100.0f ? 100.0f : x); };

          if (!id(heater_allowed) || !id(brew_boiler_temp).has_state() || isnan(id(brew_boiler_temp).state)) {
            id(heater_ssr).turn_off();
            Iacc = 0.0f; d_filt = 0.0f; last_temp = NAN;
            window_start_ms = millis();
            return;
          }

          // dt (s)
          const uint32_t now_ms = millis();
          float dt = (now_ms - last_ms) / 1000.0f;
          if (dt <= 0.0f || dt > 5.0f) dt = 0.1f;  // fallback to nominal cadence
          last_ms = now_ms;

          // CleverCoffee parameters
          const float setpoint = id(steam_mode_active) ?
                                 id(steam_set_temp)->state : id(brew_set_temp)->state;
          const float Kp = id(steam_mode_active) ?
                           id(cc_steam_kp)->state : id(cc_kp)->state;
          const float Tn = id(cc_tn)->state;
          const float Tv = id(cc_tv)->state;
          const float Imax = id(cc_integrator_max)->state;    // pre-Ki clamp
          const float out_min = id(cc_out_min)->state;        // %
          const float out_max = id(cc_out_max)->state;        // %
          const float d_alpha = id(cc_d_alpha)->state;        // 0..1
          const float window_ms_f = id(cc_burst_window_ms)->state;  // e.g. 2000 ms
          const float window_ms = fmaxf(window_ms_f, 250.0f);       // enforce minimum window

          // Derived gains
          float Ki = 0.0f;
          if (Tn > 0.0f) Ki = Kp / Tn;
          const float Kd = Kp * Tv;

          // Process variables
          const float pv = id(brew_boiler_temp).state;
          const float err = setpoint - pv;

          if (isnan(last_temp)) last_temp = pv;
          const float d_meas = (pv - last_temp) / dt;

          // Clamp implausible sensor jumps (TSIC glitches)
          const float max_dpv = 1.2f;  // °C per second, was 2.0
          float d_meas_clamped = d_meas;
          if (d_meas_clamped > max_dpv) d_meas_clamped = max_dpv;
          if (d_meas_clamped < -max_dpv) d_meas_clamped = -max_dpv;

          // Deadband to stop integrating sensor quantisation noise, was 0.05 originally
          const float integral_deadband = 0.1f;  // °C

          // does not work! if (fabsf(err) <= integral_deadband) d_meas_clamped = 0.0f; // added later
          const float P = Kp * err;
          const float D_raw = -Kd * d_meas_clamped;
          d_filt = d_alpha * D_raw + (1.0f - d_alpha) * d_filt;
          const float D = d_filt;

          // Conditional integration with deadband
          float u_no_i = P + D;
          bool can_I = true;
          float tentative = u_no_i + Ki * Iacc;
          if ((tentative >= out_max && err > 0.0f) || (tentative <= out_min && err < 0.0f)) {
            can_I = false;
          }
          // Deadband calculation
          if (can_I && fabsf(err) > integral_deadband) {
            Iacc += err * dt;
          }

          if (Iacc > Imax) Iacc = Imax;
          if (Iacc < -Imax) Iacc = -Imax;

          const float I = Ki * Iacc;

          float out_pct = P + I + D;
          if (out_pct > out_max) out_pct = out_max;
          if (out_pct < out_min) out_pct = out_min;

          // Time-proportioning (burst) output
          if (now_ms - window_start_ms >= window_ms) {
            // start a new window
            window_start_ms += window_ms;
            if (now_ms - window_start_ms >= window_ms) {
              window_start_ms = now_ms; // catch missed windows
            }
          }

          const float duty = clamp01(out_pct / 100.0f);
          const float on_ms = duty * window_ms;
          const float elapsed_in_window = now_ms - window_start_ms;

          if (elapsed_in_window < on_ms && duty > 0.0f) {
            id(heater_ssr).turn_on();
          } else {
            id(heater_ssr).turn_off();
          }

          last_temp = pv;

          // Store heater output level for display
          id(heater_output_level) = out_pct / 100.0f;

          // Check for PID parameter changes
          bool params_changed = false;
          bool window_changed = false;
          if (id(last_kp) != Kp || id(last_tn) != Tn || id(last_tv) != Tv ||
              id(last_integrator_max) != Imax || id(last_d_alpha) != d_alpha) {
            params_changed = true;
            id(last_kp) = Kp;
            id(last_tn) = Tn;
            id(last_tv) = Tv;
            id(last_integrator_max) = Imax;
            id(last_d_alpha) = d_alpha;
          }

          if (id(last_window_ms) != window_ms) {
            window_changed = true;
            id(last_window_ms) = window_ms;
          }

          // Additional useful PID debugging metrics
          const float err_rate = (dt > 0.0f) ? (err / dt) : 0.0f;  // Rate of change of error
          const float output_rate = (dt > 0.0f) ? ((out_pct - 100.0f * id(heater_output_level)) / dt) : 0.0f;  // Rate of change of output
          const bool integral_saturated = (Iacc >= Imax || Iacc <= -Imax);
          const float pid_terms_sum = P + I + D;
          const float pid_gain_ratio = (err != 0.0f) ? (out_pct / err) : 0.0f;  // Overall gain ratio

          if (id(pid_debug_enable).state) {
            if (!id(pid_initialized)) {
              // Log all PID inputs once after boot for debugging
              ESP_LOGI("PID_DEBUG", "PID Initialized: Kp=%.1f Tn=%.1f Tv=%.1f IntegratorMax=%.0f DAlpha=%.2f OutMin=%.1f OutMax=%.1f Window=%.0fms SP=%.2f",
                       Kp, Tn, Tv, Imax, d_alpha, out_min, out_max, window_ms, setpoint);
              id(pid_initialized) = true;
            }

            if (params_changed || window_changed) {
              if (window_changed) {
                ESP_LOGI("PID_DEBUG",
                         "PID Parameters & Window: Kp=%.1f Tn=%.1f Tv=%.1f IntegratorMax=%.0f DAlpha=%.2f Window=%.0fms dt=%.3fs SP=%.2f PV=%.2f err=%.3f P=%.2f I=%.2f (Iacc=%.2f) D=%.2f (Df=%.2f) out=%.1f%% gain=%.2f int_sat=%d",
                         Kp, Tn, Tv, Imax, d_alpha, window_ms, dt, setpoint, pv, err, P, I, Iacc, D, d_filt, out_pct, pid_gain_ratio, integral_saturated ? 1 : 0);
              } else {
                ESP_LOGI("PID_DEBUG",
                         "PID Parameters: Kp=%.1f Tn=%.1f Tv=%.1f IntegratorMax=%.0f DAlpha=%.2f dt=%.3fs SP=%.2f PV=%.2f err=%.3f P=%.2f I=%.2f (Iacc=%.2f) D=%.2f (Df=%.2f) out=%.1f%% gain=%.2f int_sat=%d",
                         Kp, Tn, Tv, Imax, d_alpha, dt, setpoint, pv, err, P, I, Iacc, D, d_filt, out_pct, pid_gain_ratio, integral_saturated ? 1 : 0);
              }
            } else {
              ESP_LOGI("PID_DEBUG",
                       "dt=%.3fs SP=%.2f PV=%.2f err=%.3f err_rate=%.2f P=%.2f I=%.2f (Iacc=%.2f) D=%.2f (Df=%.2f) out=%.1f%% out_rate=%.2f gain=%.2f int_sat=%d",
                       dt, setpoint, pv, err, err_rate, P, I, Iacc, D, d_filt, out_pct, output_rate, pid_gain_ratio, integral_saturated ? 1 : 0);
            }
          }

  # Timer handling (preserved from original)
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();

          if (id(idle_timer_active)) {
            const uint32_t duration_ms = static_cast<uint32_t>(id(idle_timer_minutes)->state * 60000.0f);
            if (duration_ms > 0 && now - id(idle_timer_start_ms) >= duration_ms) {
              id(idle_timer_active) = false;
              id(idle_timer_expired) = true;
              id(publish_status)->execute("IP", "Idle timeout");
              if (id(heater_enable).state) {
                id(heater_enable).turn_off();
              }
            }
          }

          if (id(steam_timer_active) && id(steam_mode_active)) {
            const uint32_t duration_ms = static_cast<uint32_t>(id(steam_timer_minutes)->state * 60000.0f);
            if (duration_ms > 0 && now - id(steam_timer_start_ms) >= duration_ms) {
              id(steam_timer_active) = false;
              id(publish_status)->execute("MF", "Steam timer");
              id(exit_steam_mode).execute();
            }
          }

          if (!id(brewing_active) && !id(continuous_brew_active) &&
              id(brew_finish_display_until) > 0 && now >= id(brew_finish_display_until)) {
            id(brew_finish_display_until) = 0;
            if (!id(steam_mode_active) && id(heater_allowed) && !id(idle_timer_expired)) {
              if (!id(pump_relay_enable)->state && !id(valve_relay_enable)->state) {
                id(publish_status)->execute("I0", "PID only");
              } else {
                id(publish_status)->execute("I0", "Idle");
              }
            }
          }

          if (id(cleaning_complete_until) > 0 && now >= id(cleaning_complete_until)) {
            id(cleaning_complete_until) = 0;
            if (!id(steam_mode_active) && !id(brewing_active) &&
                !id(continuous_brew_active) && id(cleaning_mode) == 0) {
              if (!id(pump_relay_enable)->state && !id(valve_relay_enable)->state) {
                id(publish_status)->execute(id(heater_allowed) ? "I0" : "IH", id(heater_allowed) ? "PID only" : "Heater disabled");
              } else {
                id(publish_status)->execute(id(heater_allowed) ? "I0" : "IH", id(heater_allowed) ? "Idle" : "Heater disabled");
              }
            }
          }

script:
  - id: publish_status
    mode: single
    parameters:
      code: string
      text: string
    then:
      - lambda: |-
          id(machine_status_code).publish_state(code);
          id(machine_status_text).publish_state(text);

  - id: pump_output_on
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(pump_relay_enable)->state;'
          then:
            - output.turn_on: pump_output

  - id: pump_output_off_guard
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(pump_override_state);'
          then:
            - output.turn_off: pump_output

  - id: valve_output_on
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(valve_relay_enable)->state;'
          then:
            - output.turn_on: valve_output

  - id: valve_output_off_guard
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(valve_override_state);'
          then:
            - output.turn_off: valve_output

  - id: start_idle_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(idle_timer_enable)->state;'
          then:
            - lambda: |-
                id(idle_timer_active) = true;
                id(idle_timer_expired) = false;
                id(idle_timer_start_ms) = millis();

  - id: cancel_idle_timer
    mode: restart
    then:
      - lambda: 'id(idle_timer_active) = false;'

  - id: start_steam_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(steam_timer_enable)->state;'
          then:
            - lambda: |-
                id(steam_timer_active) = true;
                id(steam_timer_start_ms) = millis();

  - id: cancel_steam_timer
    mode: restart
    then:
      - lambda: 'id(steam_timer_active) = false;'

  - id: pump_and_valve_off_guard
    mode: restart
    then:
      - script.execute: pump_output_off_guard
      - script.execute: valve_output_off_guard

  - id: brew_finish
    mode: restart
    then:
      - script.execute: pump_and_valve_off_guard
      - lambda: |-
          id(brewing_active) = false;
          id(continuous_brew_active) = false;
          const uint32_t now = millis();
          id(total_duration_ms) = 0;
          id(total_start_ms) = now;
          id(phase_duration_ms) = 0;
          id(phase_start_ms) = now;
          id(current_phase) = id(steam_mode_active) ? 5 : 0;
          if (id(brew_cycle_success)) {
            const uint32_t display_ms = static_cast<uint32_t>(id(result_display_time)->state * 1000.0f);
            id(brew_finish_display_until) = now + display_ms;
            if (id(last_brew_type) == 1) {
              id(publish_status)->execute("PF", "Pre-Infusion Finished");
            } else if (id(last_brew_type) == 2) {
              id(publish_status)->execute("SF", "Soft Finished");
            } else if (id(last_brew_type) == 3) {
              id(publish_status)->execute("RF", "Straight Finished");
            } else if (id(last_brew_type) == 4) {
              id(publish_status)->execute("CF", "Continuous Finished");
            } else {
              id(publish_status)->execute("PF", "Brew Finished");
            }
          } else if (!id(steam_mode_active)) {
            id(publish_status)->execute("I0", "Idle");
          }
      - if:
          condition:
            lambda: 'return id(steam_mode_active);'
          then:
            - text_sensor.template.publish:
                id: machine_status_text
                state: "Steam"

  - id: brew_abort
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(cleaning_mode) != 0;'
          then:
            - script.execute: cleaning_cancel
      - if:
          condition:
            lambda: 'return id(continuous_brew_active);'
          then:
            - script.execute: pump_and_valve_off_guard
            - lambda: |-
                const uint32_t now = millis();
                id(continuous_brew_active) = false;
                id(brewing_active) = false;
                id(current_phase) = id(steam_mode_active) ? 5 : 0;
                id(total_duration_ms) = 0;
                id(total_start_ms) = now;
                id(phase_duration_ms) = 0;
                id(phase_start_ms) = now;
                id(publish_status)->execute("CS", "Continuous Stopped");
            - delay: 500ms
            - if:
                condition:
                  lambda: 'return !id(steam_mode_active) && id(heater_allowed) && !id(idle_timer_expired) && id(cleaning_mode) == 0;'
                then:
                  - script.execute:
                      id: publish_status
                      code: "I0"
                      text: "Idle"
      - if:
          condition:
            lambda: 'return !id(heater_allowed);'
          then:
            - script.execute:
                id: publish_status
                code: "IH"
                text: "Heater disabled"
      - if:
          condition:
            lambda: 'return id(brewing_active);'
          then:
            - script.stop: brew_preinfusion
            - script.stop: brew_soft_preinfusion
            - script.stop: brew_straight
            - script.stop: brew_continuous
            - lambda: |-
                id(brew_cycle_success) = false;
                id(brew_finish_display_until) = 0;

                const char *stop_code = "PS";
                const char *stop_text = "Brew stop";

                switch (id(last_brew_type)) {
                  case 1:
                    stop_code = "PS";
                    stop_text = "Pressurized Stopped";
                    break;
                  case 2:
                    stop_code = "SS";
                    stop_text = "Soft Stopped";
                    break;
                  case 3:
                    stop_code = "RS";
                    stop_text = "Straight Stopped";
                    break;
                  case 4:
                    stop_code = "CS";
                    stop_text = "Continuous Stopped";
                    break;
                  default:
                    stop_code = id(continuous_brew_active) ? "CS" : "PS";
                    stop_text = "Brew stop";
                    break;
                }

                id(machine_status_code).publish_state(stop_code);
                id(machine_status_text).publish_state(stop_text);
            - script.execute: pump_output_off_guard
            - delay: 1s
            - script.execute: brew_finish

  - id: brew_preinfusion
    mode: restart
    then:
      - lambda: |-
          id(brewing_active) = true;
          id(last_brew_type) = 1;
          id(continuous_brew_active) = false;
          id(steam_mode_active) = false;
          id(brew_cycle_success) = true;
          id(brew_finish_display_until) = 0;
          const uint32_t now = millis();
          const uint32_t pre_ms = static_cast<uint32_t>(id(preinfuse_on_time)->state * 1000.0f);
          const uint32_t pause_ms = static_cast<uint32_t>(id(preinfuse_pause_time)->state * 1000.0f);
          const uint32_t brew_ms = static_cast<uint32_t>(id(brew_run_time)->state * 1000.0f);
          id(total_start_ms) = now;
          id(total_duration_ms) = pre_ms + pause_ms + brew_ms;
          id(phase_start_ms) = now;
          if (pre_ms > 0) {
            id(current_phase) = 1;
            id(phase_duration_ms) = pre_ms;
          } else if (pause_ms > 0) {
            id(current_phase) = 2;
            id(phase_duration_ms) = pause_ms;
          } else {
            id(current_phase) = 3;
            id(phase_duration_ms) = brew_ms;
          }
      - script.execute:
          id: publish_status
          code: "PW"
          text: "Pre-Infusion: Wetting"
      - script.execute: valve_output_on
      - if:
          condition:
            lambda: 'return id(preinfuse_on_time)->state > 0.0f;'
          then:
            - script.execute: pump_output_on
            - delay: !lambda 'return static_cast<uint32_t>(id(preinfuse_on_time)->state * 1000.0f);'
            - script.execute: pump_output_off_guard
      - if:
          condition:
            lambda: 'return id(preinfuse_pause_time)->state > 0.0f;'
          then:
            - lambda: |-
                id(current_phase) = 2;
                id(phase_start_ms) = millis();
                id(phase_duration_ms) = static_cast<uint32_t>(id(preinfuse_pause_time)->state * 1000.0f);
            - script.execute:
                id: publish_status
                code: "PB"
                text: "Pre-Infusion: Bloom"
            - delay: !lambda 'return static_cast<uint32_t>(id(preinfuse_pause_time)->state * 1000.0f);'
      - script.execute:
          id: publish_status
          code: "PR"
          text: "Pre-Infusion: Brewing"
      - lambda: |-
          id(current_phase) = 3;
          id(phase_start_ms) = millis();
          id(phase_duration_ms) = static_cast<uint32_t>(id(brew_run_time)->state * 1000.0f);
      - script.execute: pump_output_on
      - delay: !lambda 'return static_cast<uint32_t>(id(brew_run_time)->state * 1000.0f);'
      - script.execute: brew_finish

  - id: brew_soft_preinfusion
    mode: restart
    then:
      - lambda: |-
          id(brewing_active) = true;
          id(continuous_brew_active) = false;
          id(steam_mode_active) = false;
          id(last_brew_type) = 2;
          id(brew_cycle_success) = true;
          id(brew_finish_display_until) = 0;
          const uint32_t now = millis();
          const uint32_t soft_pre_ms = static_cast<uint32_t>(id(soft_preinfuse_time)->state * 1000.0f);
          const uint32_t brew_ms = static_cast<uint32_t>(id(soft_brew_run_time)->state * 1000.0f);
          id(total_start_ms) = now;
          id(total_duration_ms) = soft_pre_ms + brew_ms;
          id(phase_start_ms) = now;
          id(current_phase) = 1;
          id(phase_duration_ms) = soft_pre_ms;
      - script.execute:
          id: publish_status
          code: "SW"
          text: "Soft: Pre-Wetting"
      - script.execute: valve_output_on
      - delay: !lambda 'return static_cast<uint32_t>(id(soft_preinfuse_time)->state * 1000.0f);'
      - script.execute:
          id: publish_status
          code: "SR"
          text: "Soft: Brewing"
      - lambda: |-
          id(current_phase) = 3;
          id(phase_start_ms) = millis();
          id(phase_duration_ms) = static_cast<uint32_t>(id(soft_brew_run_time)->state * 1000.0f);
      - script.execute: pump_output_on
      - delay: !lambda 'return static_cast<uint32_t>(id(soft_brew_run_time)->state * 1000.0f);'
      - script.execute: brew_finish

  - id: brew_straight
    mode: restart
    then:
      - lambda: |-
          id(brewing_active) = true;
          id(continuous_brew_active) = false;
          id(last_brew_type) = 3;
          id(steam_mode_active) = false;
          id(brew_cycle_success) = true;
          id(brew_finish_display_until) = 0;
          const uint32_t now = millis();
          const uint32_t brew_ms = static_cast<uint32_t>(id(straight_brew_run_time)->state * 1000.0f);
          id(total_start_ms) = now;
          id(total_duration_ms) = brew_ms;
          id(current_phase) = 3;
          id(phase_start_ms) = now;
          id(phase_duration_ms) = brew_ms;
      - script.execute: valve_output_on
      - script.execute:
          id: publish_status
          code: "RR"
          text: "Straight"
      - script.execute: pump_output_on
      - delay: !lambda 'return static_cast<uint32_t>(id(straight_brew_run_time)->state * 1000.0f);'
      - script.execute: brew_finish

  - id: brew_continuous
    mode: restart
    then:
      - lambda: |-
          id(brewing_active) = true;
          id(continuous_brew_active) = true;
          id(last_brew_type) = 4;
          id(steam_mode_active) = false;
          id(brew_cycle_success) = false;
          id(brew_finish_display_until) = 0;
          id(current_phase) = 9;
          const uint32_t now = millis();
          id(total_start_ms) = now;
          id(total_duration_ms) = 0;
          id(continuous_brew_start_ms) = now;
          id(publish_status)->execute("CR", "Continuous");
      - script.execute: valve_output_on
      - script.execute: pump_output_on

  - id: enter_steam_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(heater_allowed);'
          then:
            - switch.turn_on: heater_enable
            - delay: 200ms
      - if:
          condition:
            lambda: 'return id(brewing_active) || id(continuous_brew_active);'
          then:
            - script.execute: brew_abort
            - delay: 1s
      - if:
          condition:
            lambda: 'return id(cleaning_mode) != 0;'
          then:
            - script.execute: cleaning_cancel
      - lambda: |-
          id(steam_mode_active) = true;
          id(brewing_active) = false;
          id(continuous_brew_active) = false;
          id(current_phase) = 5;
          const uint32_t now = millis();
          id(phase_start_ms) = now;
          id(phase_duration_ms) = 0;
          id(total_start_ms) = now;
          id(total_duration_ms) = 0;
      - script.execute: pump_output_off_guard
      - script.execute: valve_output_off_guard
      - script.execute:
          id: publish_status
          code: "MT"
          text: "Steam"
      - script.execute: start_steam_timer

  - id: exit_steam_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(steam_mode_active);'
          then:
            - lambda: |-
                id(steam_mode_active) = false;
                const uint32_t now = millis();
                id(current_phase) = 0;
                id(phase_start_ms) = now;
                id(phase_duration_ms) = 0;
                id(total_start_ms) = now;
                id(total_duration_ms) = 0;
            - script.execute:
                id: publish_status
                code: "MC"
                text: "Cooling"
            - script.execute: cancel_steam_timer
            - delay: 2s
            - if:
                condition:
                  lambda: 'return !id(brewing_active) && !id(continuous_brew_active) && id(cleaning_mode) == 0;'
                then:
                  - script.execute:
                      id: publish_status
                      code: "I0"
                      text: "Idle"

  - id: clean_backflush
    mode: restart
    then:
      - switch.turn_off: pump_override
      - switch.turn_off: valve_override
      - lambda: |-
          id(cleaning_mode) = 1;
          id(last_cleaning_mode) = 1;
          id(cleaning_complete_until) = 0;
          id(cleaning_cycle_index) = 0;
          id(cleaning_cycles_total) = static_cast<uint8_t>(id(backflush_cycles)->state);
          id(cleaning_step_phase) = 0;
          id(publish_status)->execute("KO", "Backflush");
      - script.execute: clean_backflush_cycle

  - id: clean_backflush_cycle
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(cleaning_mode) == 1 && id(cleaning_cycle_index) >= id(cleaning_cycles_total);'
          then:
            - script.execute: cleaning_finish
      - if:
          condition:
            lambda: 'return id(cleaning_mode) == 1 && id(cleaning_cycle_index) < id(cleaning_cycles_total);'
          then:
            - lambda: |-
                id(cleaning_cycle_index) += 1;
                const uint32_t fill_ms = static_cast<uint32_t>(id(backflush_fill_time)->state * 1000.0f);
                id(cleaning_step_phase) = 1;
                id(cleaning_step_start_ms) = millis();
                id(cleaning_step_duration_ms) = fill_ms;
                char buf[32];
                snprintf(buf, sizeof(buf), "Backflush %u/%u",
                         static_cast<unsigned>(id(cleaning_cycle_index)),
                         static_cast<unsigned>(id(cleaning_cycles_total)));
                id(publish_status)->execute("KO", buf);
            - script.execute: pump_output_on
            - script.execute: valve_output_on
            - delay: !lambda 'return static_cast<uint32_t>(id(backflush_fill_time)->state * 1000.0f);'
            - if:
                condition:
                  lambda: 'return id(cleaning_mode) == 1;'
                then:
                  - if:
                      condition:
                        lambda: 'return id(cleaning_cycle_index) < id(cleaning_cycles_total);'
                      then:
                        - lambda: |-
                            const uint32_t flush_ms = static_cast<uint32_t>(id(backflush_flush_time)->state * 1000.0f);
                            id(cleaning_step_phase) = 2;
                            id(cleaning_step_start_ms) = millis();
                            id(cleaning_step_duration_ms) = flush_ms;
                            char buf[32];
                            snprintf(buf, sizeof(buf), "Backflush rest %u",
                                     static_cast<unsigned>(id(cleaning_cycle_index)));
                            id(publish_status)->execute("KR", buf);
                        - script.execute: pump_output_off_guard
                        - script.execute: valve_output_off_guard
                        - delay: !lambda 'return static_cast<uint32_t>(id(backflush_flush_time)->state * 1000.0f);'
                        - script.execute: clean_backflush_cycle
                      else:
                        - lambda: |-
                            id(cleaning_step_phase) = 2;
                        - script.execute: pump_output_off_guard
                        - script.execute: cleaning_finish
                        - script.execute: valve_output_on

  - id: clean_purge
    mode: restart
    then:
      - switch.turn_off: pump_override
      - switch.turn_off: valve_override
      - lambda: |-
          id(cleaning_mode) = 2;
          id(last_cleaning_mode) = 2;
          id(cleaning_complete_until) = 0;
          id(cleaning_cycle_index) = 1;
          id(cleaning_cycles_total) = 1;
          const uint32_t step_ms = static_cast<uint32_t>(id(purge_duration)->state * 1000.0f);
          id(cleaning_step_phase) = 1;
          id(cleaning_step_start_ms) = millis();
          id(cleaning_step_duration_ms) = step_ms;
          id(publish_status)->execute("KP", "Purge");
      - script.execute: pump_output_on
      - script.execute: valve_output_on
      - delay: !lambda 'return static_cast<uint32_t>(id(purge_duration)->state * 1000.0f);'
      - script.execute: cleaning_finish

  - id: cleaning_finish
    mode: restart
    then:
      - script.execute: pump_and_valve_off_guard
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t display_ms = static_cast<uint32_t>(id(result_display_time)->state * 1000.0f);
          id(cleaning_step_phase) = 0;
          id(cleaning_step_duration_ms) = 0;
          id(cleaning_cycle_index) = 0;
          id(cleaning_mode) = 0;
          id(cleaning_complete_until) = now + display_ms;
          if (id(last_cleaning_mode) == 1) {
            id(publish_status)->execute("KF", "Backflush Finished");
          } else if (id(last_cleaning_mode) == 2) {
            id(publish_status)->execute("KF", "Purge Finished");
          } else {
            id(publish_status)->execute("KF", "Cleaning Finished");
          }

  - id: cleaning_cancel
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(cleaning_mode) != 0;'
          then:
            - script.execute: pump_and_valve_off_guard
            - lambda: |-
                const uint32_t now = millis();
                id(last_cleaning_mode) = id(cleaning_mode);
                id(cleaning_mode) = 0;
                id(cleaning_step_phase) = 0;
                id(cleaning_step_duration_ms) = 0;
                id(cleaning_cycle_index) = 0;
                id(cleaning_complete_until) = now + 5000UL;
                id(publish_status)->execute("KS", "Cleaning Cancelled");

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

font:
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 12
  - file: "gfonts://Roboto Mono"
    id: font_tiny
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    id: front_oled
    address: 0x3C
    offset_x: 2
    offset_y: 0
    update_interval: 0.5s
    flip_x: false
    flip_y: false
    lambda: |-
      it.fill(Color::BLACK);

      const uint32_t now = millis();
      const int line_step = 12;
      const int y_temp = 0;
      const int y_set = 12;
      const int y_base_with_set = 24;
      const int y_base_without_set = 12;
      const int bar_y = 56;

      auto fmt_time = [](uint32_t ms, char *out, size_t len) {
        const uint32_t total_seconds = (ms + 500) / 1000;
        const uint32_t minutes = total_seconds / 60;
        const uint32_t seconds = total_seconds % 60;
        snprintf(out, len, "%02u:%02u",
                 static_cast<unsigned>(minutes),
                 static_cast<unsigned>(seconds));
      };

      auto draw_progress = [&](float prog) {
        if (prog < 0.0f) prog = 0.0f;
        if (prog > 1.0f) prog = 1.0f;
        const int bar_h = 6;
        const int bar_w = 128;
        it.rectangle(0, bar_y, bar_w, bar_h);
        const int fill = static_cast<int>((bar_w - 2) * prog);
        if (fill > 0) {
          it.filled_rectangle(1, bar_y + 1, fill, bar_h - 2);
        }
      };

      float temp = id(brew_boiler_temp).state;
      float target = id(steam_mode_active)
                       ? id(steam_set_temp)->state
                       : id(brew_set_temp)->state;
      float pid_pct = id(heater_allowed) ? (id(heater_output_level) * 100.0f) : 0.0f;
      pid_pct = std::max(0.0f, std::min(100.0f, pid_pct));

      if (isnan(temp)) {
        it.printf(0, y_temp, id(font_small), "T:--.-");
      } else {
        it.printf(0, y_temp, id(font_small), "T:%.1f", temp);
      }

      char status_icons[8] = "";
      if (id(heater_allowed)) {
        strlcat(status_icons, "H", sizeof(status_icons));
      }
      if (id(pump_override_state) || id(brewing_active) || id(continuous_brew_active)) {
        strlcat(status_icons, "P", sizeof(status_icons));
      }
      if (id(valve_override_state) || id(brewing_active) || id(continuous_brew_active)) {
        strlcat(status_icons, "V", sizeof(status_icons));
      }
      it.printf(127, y_temp, id(font_small), TextAlign::TOP_RIGHT, "%s", status_icons);

      bool show_setpoint_line = !isnan(temp) && !isnan(target);
      if (show_setpoint_line) {
        it.printf(0, y_set, id(font_small), "S:%.1f", target);
        it.printf(127, y_set, id(font_small), TextAlign::TOP_RIGHT, "%.0f%%", pid_pct);
        it.line(0, y_base_with_set - 1, 127, y_base_with_set - 1);
      }

      bool cleaning_active = (id(cleaning_mode) > 0);
      bool cleaning_message = (id(cleaning_complete_until) > now);

      uint32_t idle_duration_ms =
          static_cast<uint32_t>(id(idle_timer_minutes)->state * 60000.0f);
      uint32_t idle_remaining_ms = 0;
      if (id(idle_timer_active) && idle_duration_ms > 0) {
        const uint32_t elapsed = now - id(idle_timer_start_ms);
        if (elapsed < idle_duration_ms) {
          idle_remaining_ms = idle_duration_ms - elapsed;
        }
      }

      const uint32_t steam_duration_ms =
          static_cast<uint32_t>(id(steam_timer_minutes)->state * 60000.0f);
      uint32_t steam_remaining_ms = 0;
      if (id(steam_mode_active) && id(steam_timer_active) && steam_duration_ms > 0) {
        const uint32_t elapsed = now - id(steam_timer_start_ms);
        if (elapsed < steam_duration_ms) {
          steam_remaining_ms = steam_duration_ms - elapsed;
        }
      }

      bool continuous = id(continuous_brew_active);
      bool brew_finished_screen = (id(brew_finish_display_until) > now);
      bool brew_active = id(brewing_active) || brew_finished_screen || continuous;

      bool override_mode =
          (!id(heater_allowed) || id(pump_override_state) ||
           id(valve_override_state) || id(idle_timer_expired));
      bool show_override_screen =
          override_mode && !cleaning_active && !cleaning_message &&
          !brew_active && !id(steam_mode_active);

      uint32_t total_duration = id(total_duration_ms);
      uint32_t total_elapsed =
          (now >= id(total_start_ms)) ? (now - id(total_start_ms)) : 0;
      if (total_duration > 0 && total_elapsed > total_duration) {
        total_elapsed = total_duration;
      }

      bool idle_screen =
          (!brew_active && !cleaning_active && !cleaning_message &&
           !id(steam_mode_active) && !show_override_screen);

      auto build_override_list = [&]() {
        char overrides[24];
        overrides[0] = '\0';
        auto append = [&](const char *word) {
          if (word == nullptr || word[0] == '\0') return;
          if (strlen(overrides) > 0) strlcat(overrides, " ", sizeof(overrides));
          strlcat(overrides, word, sizeof(overrides));
        };
        if (!id(heater_allowed)) append("Boil");
        if (id(idle_timer_expired)) append("Idle");
        if (id(pump_override_state)) append("Pump");
        if (id(valve_override_state)) append("Valve");
        if (overrides[0] == '\0') append("--");
        return std::string(overrides);
      };

      float progress_value = 0.0f;
      bool show_progress = false;

      const int content_y1 = show_setpoint_line ? y_base_with_set : y_base_without_set;
      const int content_y2 = content_y1 + line_step;
      const int content_y3 = content_y2 + line_step;

      if (cleaning_active || cleaning_message) {
        if (cleaning_active) {
          const char *mode_str =
              (id(cleaning_mode) == 1) ? "Backfl" :
              (id(cleaning_mode) == 2 ? "Purge" : "Clean");
          uint8_t total_cycles = id(cleaning_cycles_total);
          uint8_t current_cycle = id(cleaning_cycle_index);
          const char *phase_str =
              (id(cleaning_step_phase) == 1) ? "On" :
              (id(cleaning_step_phase) == 2 ? "Off" : "--");

          if (total_cycles == 0) total_cycles = 1;
          it.printf(0, content_y1, id(font_small), "[C]%s %u/%u %s",
                    mode_str,
                    static_cast<unsigned>(current_cycle),
                    static_cast<unsigned>(total_cycles),
                    phase_str);

          if (id(cleaning_step_duration_ms) > 0) {
            uint32_t step_elapsed =
                (now >= id(cleaning_step_start_ms))
                    ? (now - id(cleaning_step_start_ms))
                    : 0;
            if (step_elapsed > id(cleaning_step_duration_ms)) {
              step_elapsed = id(cleaning_step_duration_ms);
            }
            const uint32_t step_remaining =
                (id(cleaning_step_duration_ms) > step_elapsed)
                    ? (id(cleaning_step_duration_ms) - step_elapsed)
                    : 0;

            char step_remain[8];
            char step_total[8];
            fmt_time(step_remaining, step_remain, sizeof(step_remain));
            fmt_time(id(cleaning_step_duration_ms), step_total, sizeof(step_total));
            it.printf(0, content_y2, id(font_small), "Time %s/%s",
                      step_remain, step_total);

            if (id(cleaning_mode) == 1 && total_cycles > 0) {
              float base = (current_cycle > 0)
                             ? static_cast<float>(current_cycle - 1) * 2.0f
                             : 0.0f;
              float phase_prog = 0.0f;
              if (id(cleaning_step_phase) == 1) {
                phase_prog = (id(cleaning_step_duration_ms) > 0)
                               ? static_cast<float>(step_elapsed) /
                                 static_cast<float>(id(cleaning_step_duration_ms))
                               : 0.0f;
              } else if (id(cleaning_step_phase) == 2) {
                phase_prog = 1.0f;
                if (id(cleaning_step_duration_ms) > 0) {
                  phase_prog += static_cast<float>(step_elapsed) /
                                static_cast<float>(id(cleaning_step_duration_ms));
                }
              }
              float total_phases = static_cast<float>(total_cycles) * 2.0f;
              progress_value = (base + phase_prog) / total_phases;
              show_progress = true;
            } else if (id(cleaning_mode) == 2 && total_cycles > 0) {
              // Purge mode: progress is based on completed cycles plus current step progress
              float cycle_prog = (current_cycle > 0 && total_cycles > 0)
                                   ? static_cast<float>(current_cycle - 1) /
                                     static_cast<float>(total_cycles)
                                   : 0.0f;
              float step_prog = (id(cleaning_step_duration_ms) > 0)
                                  ? static_cast<float>(step_elapsed) /
                                    static_cast<float>(id(cleaning_step_duration_ms))
                                  : 0.0f;
              // Normalize: add fraction of the current cycle's step progress divided across total cycles
              progress_value = cycle_prog + (step_prog / static_cast<float>(total_cycles));
              // Clamp to [0,1]
              if (progress_value < 0.0f) progress_value = 0.0f;
              if (progress_value > 1.0f) progress_value = 1.0f;
              show_progress = true;
            }
          }
        } else {
          it.printf(0, content_y1, id(font_small), "[C]%s",
                    id(machine_status_text).state.c_str());
          show_progress = true;
          progress_value = 1.0f;
        }
      } else if (brew_active) {
        const char *mode_name = "";
        switch (id(active_brew_mode)) {
          case 1: mode_name = "Press"; break;
          case 2: mode_name = "Soft"; break;
          case 3: mode_name = "Straight"; break;
          case 4: mode_name = "Cont"; break;
        }
        if (brew_finished_screen) {
          bool success = id(brew_cycle_success);
          it.printf(0, content_y1, id(font_small), "[B]%s %s",
                    mode_name, success ? "Done" : "Stop");
          show_progress = true;
          progress_value = 1.0f;
        } else {
          const char *phase_name = "Ready";
          const char *icon = "[B]";
          switch (id(current_phase)) {
            case 1: phase_name = "Preinfuse"; break;
            case 2: phase_name = "Bloom";     break;
            case 3: phase_name = "Brew";      break;
            case 4: phase_name = "Vent";      break;
          }
          it.printf(0, content_y1, id(font_small), "[B]%s %s", mode_name, phase_name);

          char elapsed_buf[8];
          fmt_time(total_elapsed, elapsed_buf, sizeof(elapsed_buf));
          it.printf(0, content_y2, id(font_small), "Time %s", elapsed_buf);

          show_progress = (total_duration > 0);
          progress_value =
              (total_duration > 0)
                  ? static_cast<float>(total_elapsed) /
                    static_cast<float>(total_duration)
                  : 0.0f;
        }
      } else if (id(steam_mode_active)) {
        it.printf(0, content_y1, id(font_small), "[S]Steam");
        if (id(steam_timer_active) && steam_remaining_ms > 0) {
          char steam_buf[8];
          fmt_time(steam_remaining_ms, steam_buf, sizeof(steam_buf));
          it.printf(0, content_y2, id(font_small), "Timer %s", steam_buf);
        } else if (id(steam_timer_active)) {
          it.printf(0, content_y2, id(font_small), "Timer --:--");
        }
        if (!id(heater_allowed)) {
          it.printf(0, content_y3, id(font_small), "Heater OFF");
        }
      } else if (show_override_screen) {
        const std::string overrides = build_override_list();
        it.printf(0, content_y1, id(font_small), "[!]Overrides");
        it.printf(0, content_y2, id(font_small), "%s", overrides.c_str());
        if (!id(heater_allowed)) {
          it.printf(0, content_y3, id(font_small), "Heater OFF");
        } else if (id(idle_timer_expired)) {
          it.printf(0, content_y3, id(font_small), "Idle expired");
        }
      } else if (idle_screen) {
          it.printf(0, content_y1, id(font_small), "%.1f/%.1f/%.1fs", id(preinfuse_on_time)->state, id(preinfuse_pause_time)->state, id(brew_run_time)->state);
        if (!id(heater_allowed)) {
          it.printf(0, content_y2, id(font_small), "Heater OFF");
        } else if (id(idle_timer_expired)) {
          it.printf(0, content_y2, id(font_small), "Idle expired");
        } else {
          it.printf(0, content_y2, id(font_small), "Ready");
        }

        if (id(idle_timer_active)) {
          char idle_buf[8];
          fmt_time(idle_remaining_ms, idle_buf, sizeof(idle_buf));
          it.printf(0, content_y3, id(font_small), "Idle %s", idle_buf);
        } else if (id(idle_timer_expired)) {
          it.printf(0, content_y3, id(font_small), "Idle 00:00");
        }
      }

      if (show_progress) {
        draw_progress(progress_value);
      }
