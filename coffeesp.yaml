    id: brew_set_temp
    name: "Brew Target Temperature"
    unit_of_measurement: "°C"
    min_value: 80
    max_value: 110
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: 100.0
    web_server:
      sorting_group_id: group_temp_settings

  - platform: template
    id: steam_set_temp
    name: "Steam Target Temperature"
    unit_of_measurement: "°C"
    min_value: 110
    max_value: 150
    step: 1.0
    optimistic: true
    restore_value: true
    initial_value: 125.0
    web_server:
      sorting_group_id: group_temp_settings

  - platform: template
    id: temp_sensor_offset
    name: "Temperature Sensor Offset"
    unit_of_measurement: "°C"
    min_value: -10.0
    max_value: 20.0
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: 0.0
    web_server:
      sorting_group_id: group_temp_settings

  - platform: template
    id: cc_kp
    name: "PID Kp"
    unit_of_measurement: ""
    min_value: 0.1
    max_value: 200.0
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: 48.0
    web_server:
      sorting_group_id: group_pid_settings

  - platform: template
    id: cc_tn
    name: "PID Tn (Integral Time)"
    unit_of_measurement: "s"
    min_value: 1.0
    max_value: 1000.0
