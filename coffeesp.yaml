# CoffeeSP - ESPHome PID controller with xs5871 TSIC integration, SH1106 128x64 display and relay control based on CleverCoffee PCB v1.6
# https://github.com/ejetzass/CoffeeSP
# ----
# CleverCoffee ESP32 PCB Rev 1.6 Pin Map
# ----
# HT_RL (Heater SSR)              -> GPIO2  (Burst-fired SSR)
# PV_RL VALVE (3-way valve SSR)   -> GPIO17
# PV_RL PUMP  (Pump SSR)          -> GPIO27
# TSIC Temperature sensor         -> GPIO16
# Status LED                      -> GPIO26 (active-low: set inverted true if needed)
# I2C SDA/SCL (OLED, pressure)    -> GPIO21 / GPIO22
# Brew button (pre-infusion)      -> GPIO34 (/ optocoupler)
# Steam button                    -> GPIO35
# Hot water button (straight)     -> GPIO36
# Power button (soft)             -> GPIO39
# Water level sensor (optional)   -> GPIO23 (currently unused)
# Scale interface DAT2/DAT/CLK    -> GPIO25 / GPIO32 / GPIO33 (currently unused)
# Reserved headers (future use)   -> GPIO1, GPIO3, GPIO4, GPIO5, GPIO18, GPIO19
# JTAG debugger pads              -> GPIO12 (TDI), GPIO13 (TCK), GPIO14 (TMS), GPIO15 (TDO) (currently unused)
# ----

substitutions:
  device_name: coffeesp
  friendly_name: CoffeeSP

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ESPHome PID controller with xs5871 TSIC integration, SH1106 128x64 display and relay control based on CleverCoffee PCB v1.6"
  project:
    name: coffeesp.espresso_controller
    version: "1.9.0"
  on_boot:
    priority: -10
    then:
      - lambda: |-
          const uint32_t now = millis();
          id(current_phase) = id(steam_mode_active) ? 5 : 0;
          id(phase_start_ms) = now;
          id(phase_duration_ms) = 0;
          id(total_start_ms) = now;
          id(total_duration_ms) = 0;
          id(brew_finish_display_until) = 0;
      - delay: 5s
      - switch.turn_on: heater_enable
      - script.execute:
          id: publish_status
          code: "I0"
          text: "Idle"

esp32:
  board: az-delivery-devkit-v4
  framework:
    type: arduino

logger:
  level: DEBUG
  initial_level: WARN
  runtime_tag_levels: true
  logs:
    component: WARN
    wifi: WARN
    tsic: WARN
    sensor: WARN
    PID_DEBUG: DEBUG

api:
  encryption:
    key: !secret coffeesp_api_key

ota:
  - platform: esphome
    password: !secret esphome_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback AP"
    password: "${device_name}"

# Enable web server on port 80
web_server:
  port: 80
  auth:
    username: !secret coffeesp_web_user
    password: !secret coffeesp_web_pass
  version: 3
  sorting_groups:
    - id: group_brew
      name: "Brewing"
      sorting_weight: 10
    - id: group_time_settings
      name: "Time Settings"
      sorting_weight: 20
    - id: group_temp_settings
      name: "Temperature Settings"
      sorting_weight: 30
    - id: group_pid_settings
      name: "PID Settings"
      sorting_weight: 35
    - id: group_switch
      name: "Switches"
      sorting_weight: 40
    - id: group_sensors
      name: "Sensors"
      sorting_weight: 50
    - id: group_hardware
      name: "Hardware Control"
      sorting_weight: 60
    - id: group_clean
      name: "Cleaning"
      sorting_weight: 70
    - id: group_clean_settings
      name: "Cleaning Settings"
      sorting_weight: 80
    - id: group_timer_settings
      name: "Timer Settings"
      sorting_weight: 90
    - id: group_diag
      name: "Diagnosis"
      sorting_weight: 99
    - id: group_server
      name: "Server & Logging"
      sorting_weight: 90

time:
  - platform: homeassistant
    id: ha_time

external_components:
  - source: github://xs5871/esphome-tsic@main
    refresh: 1d

globals:
  - id: brewing_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: steam_mode_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: heater_allowed
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: current_phase
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: last_brew_type
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: phase_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: phase_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: total_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: total_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: heater_output_level
    type: float
    restore_value: no
    initial_value: '0.0f'
  - id: idle_timer_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: idle_timer_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: idle_timer_expired
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: steam_timer_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: steam_timer_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: continuous_brew_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: continuous_brew_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: brew_finish_display_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: brew_cycle_success
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cleaning_mode
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: last_cleaning_mode
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_cycle_index
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_cycles_total
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_step_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_step_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_step_phase
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: cleaning_complete_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pump_override_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: valve_override_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: active_brew_mode
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: last_kp
    type: float
    restore_value: no
    initial_value: '-1.0f'
  - id: last_tn
    type: float
    restore_value: no
    initial_value: '-1.0f'
  - id: last_tv
    type: float
    restore_value: no
    initial_value: '-1.0f'
  - id: last_integrator_max
    type: float
    restore_value: no
    initial_value: '-1.0f'
  - id: last_d_alpha
    type: float
    restore_value: no
    initial_value: '-1.0f'
  - id: last_window_ms
    type: float
    restore_value: no
    initial_value: '-1.0f'
  - id: pid_initialized
    type: bool
    restore_value: no
    initial_value: 'false'

text_sensor:
  - platform: template
    id: machine_status_text
    name: "${friendly_name} Status"
    update_interval: never
    icon: mdi:coffee-maker
    web_server:
      sorting_group_id: group_sensors

  - platform: template
    id: machine_status_code
    name: "${friendly_name} Status Code"
    update_interval: never
    icon: mdi:code-tags
    web_server:
      sorting_group_id: group_sensors



