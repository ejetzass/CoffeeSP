    min_value: 0.0
    max_value: 100.0
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: 0.0
    web_server:
      sorting_group_id: group_pid_settings

  - platform: template
    id: cc_out_max
    name: "PID Output Maximum"
    unit_of_measurement: "%"
    min_value: 0.0
    max_value: 100.0
    step: 0.1
